<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Racing Game</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="fore">
        <div id="version">v1.2.0</div>
        <div class="title" id="title">Online Racing Game!</div>
        
        <div id="menu-content">
            <div class="menuitem title">Pick a name:<br/>
                <input id="name" class="title" placeholder="Name" autocomplete="off" style="margin-top:5px;">
            </div>

            <div class="menuitem title" style="margin-top: 15px;">
                <div id="start" onclick="menu2()" style="cursor:pointer; padding:10px; background:#444; color:#fff; display:inline-block;">Start!</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

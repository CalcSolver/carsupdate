<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Online Racing Game</title>

    <!-- Retro Arcade Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="fore">
        <div id="version">v1.2.0</div>
        <div class="title" id="title">Online Racing Game!</div>
        
        <div id="menu-content">
            <div class="menuitem title">Pick a name:<br/>
                <input id="name" class="title" placeholder="Player 1" autocomplete="off" maxlength="12">
            </div>

            <div class="menuitem title">Choose a color:<br/>
                <div id="colorpicker" onclick="updateColorFromEvent(event)" onmousemove="if(event.buttons===1) updateColorFromEvent(event)">
                    <div id="slider"></div>
                </div>
            </div>

            <div class="menuitem title">
                <div id="start" onclick="menu2()">Start!</div>
            </div>
        </div>

        <div id="toolbar">
            <div class="tools" id="edit" onclick="window.open('editor/index.html')">⚙️</div>
            <div class="tools" id="help" onclick="window.open('help/index.html')">?</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
